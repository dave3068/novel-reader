# Novel Reader Android 构建属性（AN1 版本锁的一部分）
#
# 固定 JDK 17：规格要求 JDK 17（docs/novel-reader-v1-development-plan.md §3.2），
# 这里显式指向本机 JDK 17，使 `./gradlew` 不依赖调用方 shell 是否导出了 JAVA_HOME。
org.gradle.java.home=/opt/dev-tools/jdk/jdk-17

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# 禁止 Gradle 联网自动下载 JDK 工具链（本机已有 JDK 17）
org.gradle.java.installations.auto-download=false

android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
# AGP 对本机 compileSdk 36 的兼容性提示降级为警告
android.suppressUnsupportedCompileSdk=36

kotlin.code.style=official
